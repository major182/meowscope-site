# PR と main へのプッシュのたびに、手元の npm run check と同じチェックを GitHub 上でも動かす
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR に続けてプッシュしたら、古い実行を止める。main へのプッシュの実行は止めない
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Astro の利用状況の送信を止める（要件 NF-SC-02 と同じ考えで、送らなくてよいものは送らない）
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      # 整形・型・組み立て・テスト（出来上がりの HTML とリンク）
      - run: npm run check
