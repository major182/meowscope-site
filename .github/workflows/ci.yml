# PR と main へのプッシュのたびに、手元の npm run check と同じチェックを GitHub 上でも動かす
# main へのプッシュでは、チェックを通した出来上がり（dist）を GitHub Pages に出す（要件 C-01）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR に続けてプッシュしたら、古い実行を止める。main へのプッシュの実行は止めない
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Astro の利用状況の送信を止める（要件 NF-SC-02 と同じ考えで、送らなくてよいものは送らない）
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      # 整形・型・組み立て・テスト（出来上がりの HTML とリンク）
      - run: npm run check
      # main のときだけ、チェックを通した出来上がりを Pages に渡す（組み立て直さず、確かめたものをそのまま出す）
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Pages に出す権限は、このジョブだけに与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 出す途中で次の公開を始めない（順番に出す）
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
